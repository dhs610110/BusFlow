name: Build minimal Windows GTA dhs_gpt_commited
on:
  push:
    paths:
      - 'packaging/*dhs_gpt_commited.py'
      - '.github/workflows/windows_package_dhs_gpt_commited.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      BUSFLOW_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: wrapper
      - uses: actions/checkout@v4
        with:
          repository: wkddnjswkdwkdwkd1-svg/BusFlow
          ref: 185858dc94417403f25581ad24a67a506df17f1c
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only runtime model dependencies and builder
        shell: pwsh
        run: |
          $needed = Get-Content upstream/requirements.txt | Where-Object { $_ -match '^(numpy|pandas|scikit-learn|joblib|holidays)([=<>]|$)' }
          $needed | Set-Content runtime_requirements.txt
          python -m pip install -r runtime_requirements.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build minimal package
        run: python wrapper/packaging/build_windows_dhs_gpt_commited.py upstream
      - name: Smoke test frozen exe without external API calls
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "$pwd/dist/GTA/GTA.exe" -ArgumentList '--headless' -PassThru
          try {
            for ($n=0; $n -lt 60; $n++) {
              if (Test-Path dist/GTA/ready.txt) { break }
              if ($proc.HasExited) { if (Test-Path dist/GTA/GTA_error.log) { Get-Content dist/GTA/GTA_error.log }; throw 'Executable exited before ready' }
              Start-Sleep -Seconds 1
            }
            $url = Get-Content dist/GTA/ready.txt
            $health = Invoke-RestMethod "$url/api/health"
            if ($health.status -ne 'ready' -or !$health.offline) { throw 'Health check failed' }
            $catalog = Invoke-RestMethod "$url/api/catalog"
            if (!$catalog.'5003A') { throw 'Catalog missing' }
            $page = Invoke-WebRequest $url
            if ($page.StatusCode -ne 200) { throw 'Page failed' }
            Write-Output 'PASS frozen Windows executable: all models load, DB/catalog/static page served; no bus/weather API calls.'
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id }
            Remove-Item dist/GTA/ready.txt -ErrorAction SilentlyContinue
          }
      - name: Upload executable package
        uses: actions/upload-artifact@v4
        with:
          name: GTA_Windows
          path: dist/GTA/
          compression-level: 9
          retention-days: 14
