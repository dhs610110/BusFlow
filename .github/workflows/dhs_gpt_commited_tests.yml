name: dhs_gpt_commited tests

on:
  push:
    paths:
      - 'app_dhs_gpt_commited.py'
      - 'requirements_dhs_gpt_commited.txt'
      - 'services/*dhs_gpt_commited*'
      - 'tests/*dhs_gpt_commited*'
      - '.github/workflows/dhs_gpt_commited_tests.yml'
  pull_request:
    paths:
      - 'app_dhs_gpt_commited.py'
      - 'requirements_dhs_gpt_commited.txt'
      - 'services/*dhs_gpt_commited*'
      - 'tests/*dhs_gpt_commited*'
      - '.github/workflows/dhs_gpt_commited_tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest holidays

      - name: Run dhs_gpt_commited tests
        run: |
          python -m pytest -q tests/test_weather_delay_dhs_gpt_commited.py
